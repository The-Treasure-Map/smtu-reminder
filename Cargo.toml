[package]
name = "smtu-reminder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
chrono = "0.4.42"
futures = "0.3.31"
reqwest = { version = "0.13.1", features = ["form", "cookies"] }
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "sqlite", "macros"] }
structopt = "0.3.26"
teloxide = { version = "0.17.0", features = ["full"] }
tokio = "1.49.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

